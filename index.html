<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Viral Image Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-primary: #1a202c;
            --text-secondary: #4a5568;
            --bg-secondary: #f7fafc;
            --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 25px 50px rgba(0, 0, 0, 0.15);
            --border-radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--primary-gradient);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .app-header {
            background: var(--accent-gradient);
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .app-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grain" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="25" cy="25" r="1" fill="white" opacity="0.1"/><circle cx="75" cy="75" r="1" fill="white" opacity="0.1"/><circle cx="50" cy="10" r="0.5" fill="white" opacity="0.1"/><circle cx="10" cy="60" r="0.5" fill="white" opacity="0.1"/><circle cx="90" cy="40" r="1" fill="white" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23grain)"/></svg>');
            pointer-events: none;
        }

        .app-header h1 {
            font-size: 3.5em;
            font-weight: 700;
            color: white;
            margin-bottom: 12px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            letter-spacing: -2px;
            position: relative;
            z-index: 1;
        }

        .app-header p {
            font-size: 1.3em;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
            position: relative;
            z-index: 1;
        }

        .main-grid {
            display: grid;
            grid-template-columns: minmax(400px, 1fr) 1fr;
            min-height: 600px;
        }

        .controls-panel {
            background: white;
            padding: 40px;
            border-right: 1px solid #e2e8f0;
        }

        .preview-panel {
            background: linear-gradient(135deg, #f8fafc 0%, #edf2f7 100%);
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .section-title {
            font-size: 1.4em;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-group {
            margin-bottom: 32px;
        }

        .control-label {
            font-size: 0.95em;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .toggle-btn {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid #e2e8f0;
            background: white;
            color: var(--text-secondary);
            border-radius: var(--border-radius);
            font-weight: 500;
            font-size: 0.95em;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .toggle-btn:hover {
            border-color: #cbd5e0;
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .toggle-btn.active {
            background: var(--success-gradient);
            border-color: transparent;
            color: white;
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .form-select {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e2e8f0;
            border-radius: var(--border-radius);
            font-size: 0.95em;
            font-weight: 500;
            background: white;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            appearance: none;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>');
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 20px;
        }

        .form-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .custom-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e2e8f0;
            border-radius: var(--border-radius);
            font-size: 0.95em;
            font-weight: 400;
            background: white;
            color: var(--text-primary);
            transition: var(--transition);
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        .custom-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .generate-btn {
            width: 100%;
            padding: 20px 30px;
            background: var(--accent-gradient);
            border: none;
            border-radius: var(--border-radius);
            color: white;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        .generate-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .generate-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .generate-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .generate-btn:hover::before {
            left: 100%;
        }

        .preview-area {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .preview-placeholder {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px;
        }

        .preview-placeholder h3 {
            font-size: 1.3em;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .preview-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: var(--border-radius);
        }

        .action-buttons {
            display: flex;
            gap: 16px;
        }

        .action-btn {
            padding: 14px 24px;
            border: none;
            border-radius: var(--border-radius);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.95em;
        }

        .download-btn {
            background: var(--success-gradient);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .download-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .secondary-btn {
            background: white;
            color: var(--text-primary);
            border: 2px solid #e2e8f0;
        }

        .secondary-btn:hover {
            border-color: #cbd5e0;
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .status-message {
            padding: 16px 20px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            font-weight: 500;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-loading {
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            color: white;
        }

        .status-success {
            background: linear-gradient(135deg, #34d399, #10b981);
            color: white;
        }

        .status-error {
            background: linear-gradient(135deg, #f87171, #ef4444);
            color: white;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .controls-panel,
            .preview-panel {
                padding: 24px;
            }

            .app-header h1 {
                font-size: 2.5em;
            }

            .button-group {
                flex-direction: column;
            }

            .action-buttons {
                flex-direction: column;
                width: 100%;
            }

            .preview-area {
                max-width: 100%;
            }
        }

        .feature-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .loading-spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 12px;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="feature-badge">AI Powered</div>
            <h1>✨ Viral Image Studio</h1>
            <p>Create stunning viral content for social media in seconds</p>
        </header>

        <div class="main-grid">
            <div class="controls-panel">
                <div class="section-title">
                    🎯 Content Generator
                </div>

                <div id="statusMessage" class="status-message" style="display: none;"></div>

                <div class="control-group">
                    <label class="control-label">📋 Content Type</label>
                    <div class="button-group">
                        <div class="toggle-btn active" data-type="viral">
                            <span>🔥 Viral Content</span><br>
                            <small>Hugot, riddles, trending</small>
                        </div>
                        <div class="toggle-btn" data-type="branded">
                            <span>🏷️ Branded Content</span><br>
                            <small>Custom brand graphics</small>
                        </div>
                    </div>
                </div>

                <div id="viralOptions" class="control-group">
                    <label class="control-label">🔥 Viral Type</label>
                    <select id="viralType" class="form-select">
                        <option value="hugot_tagalog">💔 Hugot Tagalog</option>
                        <option value="hugot_english">💔 Hugot English</option>
                        <option value="motivation">💪 Motivation</option>
                    </select>
                </div>

                <div id="brandedOptions" class="control-group" style="display: none;">
                    <label class="control-label">✏️ Custom Text</label>
                    <textarea id="customText" class="custom-input" placeholder="Enter your custom message here..."></textarea>
                </div>

                <div class="control-group">
                    <label class="control-label">📱 Format</label>
                    <select id="formatType" class="form-select">
                        <option value="instagram_post">📸 Instagram Post (1080×1080)</option>
                        <option value="facebook_post">📘 Facebook Post (1200×630)</option>
                        <option value="twitter_post">🐦 Twitter Post (1024×512)</option>
                    </select>
                </div>

                <button id="generateBtn" class="generate-btn">
                    ✨ Generate Image
                </button>
            </div>

            <div class="preview-panel">
                <div class="section-title">
                    🖼️ Preview
                </div>

                <div id="previewArea" class="preview-area">
                    <div class="preview-placeholder">
                        <h3>🎨 Your generated image will appear here</h3>
                        <p>Select a content type and click generate!</p>
                    </div>
                </div>

                <div id="downloadSection" class="action-buttons" style="display: none;">
                    <button id="downloadBtn" class="action-btn download-btn">
                        💾 Download Image
                    </button>
                    <button id="generateAnother" class="action-btn secondary-btn">
                        🔄 Generate Another
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedContentType = 'viral';
        let currentImagePath = null;

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            showStatus('🚀 Viral Image Studio loaded and ready!', 'success');
            setTimeout(() => hideStatus(), 3000);
        });

        // Content type switching
        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const type = this.dataset.type;
                selectContentType(type);
            });
        });

        function selectContentType(type) {
            selectedContentType = type;
            
            // Update UI
            document.querySelectorAll('.toggle-btn').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelector(`[data-type="${type}"]`).classList.add('active');
            
            // Show/hide options
            if (type === 'viral') {
                document.getElementById('viralOptions').style.display = 'block';
                document.getElementById('brandedOptions').style.display = 'none';
            } else {
                document.getElementById('viralOptions').style.display = 'none';
                document.getElementById('brandedOptions').style.display = 'block';
            }
            
            hidePreview();
        }

        // Generate button
        document.getElementById('generateBtn').addEventListener('click', generateImage);
        document.getElementById('generateAnother').addEventListener('click', generateImage);
        document.getElementById('downloadBtn').addEventListener('click', downloadImage);

        function showStatus(message, type = 'loading') {
            const statusEl = document.getElementById('statusMessage');
            statusEl.textContent = message;
            statusEl.className = `status-message status-${type}`;
            statusEl.style.display = 'block';
            
            if (type !== 'loading') {
                setTimeout(() => {
                    hideStatus();
                }, 5000);
            }
        }

        function hideStatus() {
            const statusEl = document.getElementById('statusMessage');
            statusEl.style.display = 'none';
        }

        async function generateImage() {
            const generateBtn = document.getElementById('generateBtn');
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<span class="loading-spinner"></span>Creating your masterpiece...';
            
            showStatus('🎨 Creating your viral image...', 'loading');
            hidePreview();

            try {
                let response;
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);
                
                if (selectedContentType === 'viral') {
                    const viralType = document.getElementById('viralType').value;
                    const format = document.getElementById('formatType').value;
                    
                    response = await fetch('/api/generate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            type: viralType,
                            format: format
                        }),
                        signal: controller.signal
                    });
                } else {
                    const text = document.getElementById('customText').value;
                    const format = document.getElementById('formatType').value;
                    
                    if (!text.trim()) {
                        showStatus('❌ Please enter some text for your image', 'error');
                        return;
                    }
                    
                    response = await fetch('/api/generate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            type: 'custom',
                            text: text,
                            format: format
                        }),
                        signal: controller.signal
                    });
                }
                
                clearTimeout(timeoutId);
                
                console.log('Response status:', response.status);
                console.log('Response ok:', response.ok);
                
                if (response.ok) {
                    const result = await response.json();
                    console.log('API response:', result);
                    
                    if (result.success && result.imageData) {
                        showPreview(result.imageData, true);
                        showStatus('✅ Image generated successfully!', 'success');
                    } else {
                        throw new Error(result.error || 'No image data received');
                    }
                } else {
                    let errorMessage = `Server error (${response.status})`;
                    try {
                        const errorData = await response.json();
                        errorMessage = errorData.error || errorMessage;
                    } catch (e) {
                        errorMessage += ' - Could not parse error response';
                    }
                    throw new Error(errorMessage);
                }
                
            } catch (error) {
                console.error('Error generating image:', error);
                let errorMessage = 'Unknown error occurred';
                
                if (error.name === 'AbortError') {
                    errorMessage = 'Request timed out after 30 seconds. Please try again.';
                } else if (error.message.includes('fetch')) {
                    errorMessage = 'Server unavailable. Please wait a moment and try again.';
                } else if (error.message.includes('NetworkError') || error.message.includes('Failed to fetch')) {
                    errorMessage = 'Network connection issue. Check your connection and try again.';
                } else {
                    errorMessage = error.message;
                }
                
                showStatus(`❌ ${errorMessage}`, 'error');
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = '✨ Generate Image';
            }
        }

        function showPreview(imagePath, isBase64 = false) {
            currentImagePath = imagePath;
            const previewArea = document.getElementById('previewArea');
            previewArea.innerHTML = `<img src="${imagePath}" class="preview-image" alt="Generated Image">`;
            document.getElementById('downloadSection').style.display = 'flex';
        }

        function hidePreview() {
            const previewArea = document.getElementById('previewArea');
            previewArea.innerHTML = `
                <div class="preview-placeholder">
                    <h3>🎨 Your generated image will appear here</h3>
                    <p>Select a content type and click generate!</p>
                </div>
            `;
            document.getElementById('downloadSection').style.display = 'none';
            currentImagePath = null;
        }

        function downloadImage() {
            if (currentImagePath) {
                const link = document.createElement('a');
                link.href = currentImagePath;
                link.download = `viral-image-${Date.now()}.png`;
                link.click();
                showStatus('💾 Download started!', 'success');
            }
        }
    </script>
</body>
</html>
