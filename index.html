<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viral Studio — Create Stunning Content</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #111111;
            --bg-card: #161616;
            --bg-hover: #1c1c1c;
            
            --text-primary: #ffffff;
            --text-secondary: #a8a8a8;
            --text-dim: #666666;
            
            --accent-primary: #7c3aed;
            --accent-secondary: #a855f7;
            --accent-glow: rgba(124, 58, 237, 0.5);
            
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            
            --border-color: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(255, 255, 255, 0.12);
            
            --gradient-1: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
            --gradient-2: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            --gradient-3: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 40px var(--accent-glow);
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Animated background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            opacity: 0.3;
            background: 
                radial-gradient(circle at 20% 50%, var(--accent-primary) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, var(--accent-secondary) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, #3b82f6 0%, transparent 50%);
            filter: blur(100px);
            animation: bgMove 20s ease-in-out infinite;
        }

        @keyframes bgMove {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-20px, -20px) scale(1.1); }
            66% { transform: translate(20px, -10px) scale(0.9); }
        }

        /* Noise texture overlay */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            opacity: 0.02;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj4KPGZpbHRlciBpZD0iYSI+CjxmZVR1cmJ1bGVuY2UgYmFzZUZyZXF1ZW5jeT0iLjc1IiBudW1PY3RhdmVzPSIxMCIvPgo8L2ZpbHRlcj4KPHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsdGVyPSJ1cmwoI2EpIiBvcGFjaXR5PSIxIi8+Cjwvc3ZnPg==');
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 3rem 0 4rem;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
            margin-bottom: 0.5rem;
            display: inline-block;
            position: relative;
        }

        .logo::after {
            content: 'BETA';
            position: absolute;
            top: -8px;
            right: -45px;
            font-size: 0.6rem;
            font-weight: 600;
            background: var(--accent-primary);
            color: var(--text-primary);
            padding: 2px 8px;
            border-radius: 20px;
            letter-spacing: 0;
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 400;
        }

        /* Main grid */
        .main-grid {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 2rem;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Card styles */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            overflow: hidden;
            position: relative;
            transition: var(--transition);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card:hover::before {
            opacity: 1;
        }

        .controls-card {
            padding: 2rem;
        }

        .preview-card {
            min-height: 600px;
            display: flex;
            flex-direction: column;
            padding: 2rem;
        }

        /* Section headers */
        .section-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .section-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gradient-1);
            border-radius: var(--radius-sm);
            font-size: 1.2rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Form controls */
        .form-group {
            margin-bottom: 2rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Toggle pills */
        .toggle-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            padding: 0.375rem;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            position: relative;
        }

        .toggle-btn {
            padding: 0.75rem 1rem;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: var(--radius-md);
            transition: var(--transition);
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .toggle-btn:hover {
            color: var(--text-primary);
        }

        .toggle-btn.active {
            color: var(--text-primary);
        }

        .toggle-indicator {
            position: absolute;
            top: 0.375rem;
            left: 0.375rem;
            width: calc(50% - 0.375rem);
            height: calc(100% - 0.75rem);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .toggle-indicator.right {
            left: calc(50% + 0.375rem);
        }

        /* Select dropdown */
        .select-wrapper {
            position: relative;
        }

        .select {
            width: 100%;
            padding: 0.875rem 1rem;
            padding-right: 2.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            appearance: none;
        }

        .select:hover {
            background: var(--bg-hover);
            border-color: var(--border-hover);
        }

        .select:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .select-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--text-secondary);
        }

        /* Textarea */
        .textarea {
            width: 100%;
            min-height: 120px;
            padding: 0.875rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.9375rem;
            font-family: inherit;
            resize: vertical;
            transition: var(--transition);
        }

        .textarea:hover {
            background: var(--bg-hover);
            border-color: var(--border-hover);
        }

        .textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        /* Generate button */
        .generate-btn {
            width: 100%;
            padding: 1rem 2rem;
            background: var(--gradient-1);
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .generate-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg), var(--shadow-glow);
        }

        .generate-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .generate-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .generate-btn:hover:not(:disabled)::before {
            left: 100%;
        }

        /* Preview area */
        .preview-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            border: 2px dashed var(--border-color);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            min-height: 400px;
        }

        .preview-container.has-image {
            border-style: solid;
            background: transparent;
        }

        .preview-placeholder {
            text-align: center;
            padding: 3rem;
        }

        .preview-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .preview-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .preview-subtitle {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .preview-image {
            max-width: 100%;
            max-height: 100%;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            animation: zoomIn 0.3s ease-out;
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Action buttons */
        .action-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--gradient-2);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
            border-color: var(--border-hover);
        }

        /* Status messages */
        .status-toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 300px;
            transform: translateY(100px);
            opacity: 0;
            transition: var(--transition);
            z-index: 1000;
        }

        .status-toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .status-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-icon.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }

        .status-icon.error {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error);
        }

        .status-icon.loading {
            background: rgba(124, 58, 237, 0.2);
            color: var(--accent-primary);
        }

        .status-message {
            flex: 1;
            font-size: 0.875rem;
            color: var(--text-primary);
        }

        /* Loading spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            
            .logo {
                font-size: 2rem;
            }
            
            .preview-card {
                min-height: 400px;
            }
            
            .status-toast {
                bottom: 1rem;
                right: 1rem;
                left: 1rem;
                min-width: auto;
            }
        }

        /* Hover effects */
        .hover-lift {
            transition: var(--transition);
        }

        .hover-lift:hover {
            transform: translateY(-2px);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--text-dim);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="noise"></div>

    <div class="container">
        <header class="header">
            <h1 class="logo">Viral Studio</h1>
            <p class="tagline">Create stunning viral content in seconds</p>
        </header>

        <div class="main-grid">
            <!-- Controls Panel -->
            <div class="card controls-card">
                <div class="section-header">
                    <div class="section-icon">🎯</div>
                    <h2 class="section-title">Content Generator</h2>
                </div>

                <form id="generatorForm">
                    <div class="form-group">
                        <label class="form-label">Content Type</label>
                        <div class="toggle-group">
                            <div class="toggle-indicator" id="toggleIndicator"></div>
                            <button type="button" class="toggle-btn active" data-type="viral">
                                <span>🔥 Viral</span>
                            </button>
                            <button type="button" class="toggle-btn" data-type="custom">
                                <span>✏️ Custom</span>
                            </button>
                        </div>
                    </div>

                    <div id="viralOptions" class="form-group">
                        <label class="form-label">Viral Category</label>
                        <div class="select-wrapper">
                            <select id="viralType" class="select">
                                <option value="hugot_tagalog">💔 Hugot Tagalog</option>
                                <option value="hugot_english">💔 Hugot English</option>
                                <option value="motivation">💪 Motivation</option>
                            </select>
                            <svg class="select-icon" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M4.5 5.5L8 9l3.5-3.5L10.5 4.5 8 7 5.5 4.5z"/>
                            </svg>
                        </div>
                    </div>

                    <div id="customOptions" class="form-group" style="display: none;">
                        <label class="form-label">Custom Text</label>
                        <textarea id="customText" class="textarea" 
                                  placeholder="Enter your custom message here..."
                                  maxlength="200"></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Format</label>
                        <div class="select-wrapper">
                            <select id="formatType" class="select">
                                <option value="instagram_post">📸 Instagram (1080×1080)</option>
                                <option value="facebook_post">📘 Facebook (1200×630)</option>
                                <option value="twitter_post">🐦 Twitter (1024×512)</option>
                            </select>
                            <svg class="select-icon" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M4.5 5.5L8 9l3.5-3.5L10.5 4.5 8 7 5.5 4.5z"/>
                            </svg>
                        </div>
                    </div>

                    <button type="submit" id="generateBtn" class="generate-btn">
                        <span>✨</span>
                        <span>Generate Image</span>
                    </button>
                </form>
            </div>

            <!-- Preview Panel -->
            <div class="card preview-card">
                <div class="section-header">
                    <div class="section-icon">🖼️</div>
                    <h2 class="section-title">Preview</h2>
                </div>

                <div id="previewContainer" class="preview-container">
                    <div class="preview-placeholder">
                        <div class="preview-icon">🎨</div>
                        <h3 class="preview-title">Your masterpiece awaits</h3>
                        <p class="preview-subtitle">Select options and generate to see magic happen</p>
                    </div>
                </div>

                <div id="actionGroup" class="action-group" style="display: none;">
                    <button id="downloadBtn" class="btn btn-primary">
                        <span>💾</span>
                        <span>Download</span>
                    </button>
                    <button id="regenerateBtn" class="btn btn-secondary">
                        <span>🔄</span>
                        <span>Generate Another</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Toast -->
    <div id="statusToast" class="status-toast">
        <div id="statusIcon" class="status-icon"></div>
        <div id="statusMessage" class="status-message"></div>
    </div>

    <script>
        // State management
        let state = {
            contentType: 'viral',
            currentImageData: null,
            isGenerating: false
        };

        // DOM elements
        const elements = {
            toggleBtns: document.querySelectorAll('.toggle-btn'),
            toggleIndicator: document.getElementById('toggleIndicator'),
            viralOptions: document.getElementById('viralOptions'),
            customOptions: document.getElementById('customOptions'),
            viralType: document.getElementById('viralType'),
            customText: document.getElementById('customText'),
            formatType: document.getElementById('formatType'),
            generateBtn: document.getElementById('generateBtn'),
            previewContainer: document.getElementById('previewContainer'),
            actionGroup: document.getElementById('actionGroup'),
            downloadBtn: document.getElementById('downloadBtn'),
            regenerateBtn: document.getElementById('regenerateBtn'),
            statusToast: document.getElementById('statusToast'),
            statusIcon: document.getElementById('statusIcon'),
            statusMessage: document.getElementById('statusMessage'),
            form: document.getElementById('generatorForm')
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', init);

        function init() {
            // Event listeners
            elements.toggleBtns.forEach(btn => {
                btn.addEventListener('click', () => handleContentTypeToggle(btn.dataset.type));
            });

            elements.form.addEventListener('submit', handleGenerate);
            elements.regenerateBtn.addEventListener('click', handleGenerate);
            elements.downloadBtn.addEventListener('click', handleDownload);

            // Show welcome message
            showStatus('✨ Ready to create amazing content!', 'success', 3000);
        }

        // Content type toggle
        function handleContentTypeToggle(type) {
            state.contentType = type;
            
            // Update UI
            elements.toggleBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === type);
            });
            
            // Move indicator
            elements.toggleIndicator.classList.toggle('right', type === 'custom');
            
            // Show/hide options
            elements.viralOptions.style.display = type === 'viral' ? 'block' : 'none';
            elements.customOptions.style.display = type === 'custom' ? 'block' : 'none';
            
            // Reset preview
            resetPreview();
        }

        // Generate image
        async function handleGenerate(e) {
            e.preventDefault();
            
            if (state.isGenerating) return;
            
            // Validate custom text
            if (state.contentType === 'custom' && !elements.customText.value.trim()) {
                showStatus('❌ Please enter some text', 'error');
                return;
            }
            
            state.isGenerating = true;
            updateGenerateButton(true);
            showStatus('🎨 Creating your masterpiece...', 'loading');
            
            try {
                const payload = {
                    format: elements.formatType.value,
                    ...(state.contentType === 'viral' 
                        ? { type: elements.viralType.value }
                        : { type: 'custom', text: elements.customText.value }
                    )
                };
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);
                
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || `Server error: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (!data.success || !data.imageData) {
                    throw new Error(data.error || 'No image data received');
                }
                
                // Display image
                displayImage(data.imageData);
                showStatus('✅ Image generated successfully!', 'success');
                
            } catch (error) {
                console.error('Generation error:', error);
                
                let message = '❌ ';
                if (error.name === 'AbortError') {
                    message += 'Request timed out. Please try again.';
                } else if (error.message.includes('fetch')) {
                    message += 'Connection failed. Please check your network.';
                } else {
                    message += error.message || 'Something went wrong.';
                }
                
                showStatus(message, 'error');
            } finally {
                state.isGenerating = false;
                updateGenerateButton(false);
            }
        }

        // Display generated image
        function displayImage(imageData) {
            state.currentImageData = imageData;
            
            elements.previewContainer.classList.add('has-image');
            elements.previewContainer.innerHTML = `
                <img src="${imageData}" alt="Generated image" class="preview-image" />
            `;
            
            elements.actionGroup.style.display = 'flex';
        }

        // Reset preview
        function resetPreview() {
            state.currentImageData = null;
            
            elements.previewContainer.classList.remove('has-image');
            elements.previewContainer.innerHTML = `
                <div class="preview-placeholder">
                    <div class="preview-icon">🎨</div>
                    <h3 class="preview-title">Your masterpiece awaits</h3>
                    <p class="preview-subtitle">Select options and generate to see magic happen</p>
                </div>
            `;
            
            elements.actionGroup.style.display = 'none';
        }

        // Download image
        function handleDownload() {
            if (!state.currentImageData) return;
            
            const link = document.createElement('a');
            link.href = state.currentImageData;
            link.download = `viral-${Date.now()}.png`;
            link.click();
            
            showStatus('💾 Download started!', 'success');
        }

        // Update generate button state
        function updateGenerateButton(isGenerating) {
            elements.generateBtn.disabled = isGenerating;
            elements.generateBtn.innerHTML = isGenerating
                ? '<div class="spinner"></div><span>Generating...</span>'
                : '<span>✨</span><span>Generate Image</span>';
        }

        // Show status toast
        function showStatus(message, type = 'info', duration = 5000) {
            // Update content
            elements.statusMessage.textContent = message;
            
            // Update icon
            let iconContent = '';
            switch (type) {
                case 'success':
                    iconContent = '✓';
                    break;
                case 'error':
                    iconContent = '✕';
                    break;
                case 'loading':
                    iconContent = '<div class="spinner"></div>';
                    duration = 0; // Keep loading messages visible
                    break;
                default:
                    iconContent = 'ℹ';
            }
            
            elements.statusIcon.innerHTML = iconContent;
            elements.statusIcon.className = `status-icon ${type}`;
            
            // Show toast
            elements.statusToast.classList.add('show');
            
            // Auto hide if duration is set
            if (duration > 0) {
                setTimeout(() => {
                    elements.statusToast.classList.remove('show');
                }, duration);
            }
        }
    </script>
</body>
</html>
